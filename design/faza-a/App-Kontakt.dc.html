<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  body{margin:0;}
  a{color:#0C5A63;} a:hover{color:#08363B;}
  .crow{background:#fff;border:1px solid #E1E7E9;border-radius:14px;padding:14px;display:flex;gap:13px;align-items:center;}
  .cico{width:40px;height:40px;border-radius:11px;background:#D7EAEC;display:flex;align-items:center;justify-content:center;flex:none;}
  .nav{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#9AA7AD;font-weight:500;flex:1;}
</style>
</helmet>
<div style="box-sizing:border-box;width:390px;height:844px;background:#F6F8F9;color:#0A1B2A;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden;">
  <!-- header -->
  <div style="background:#fff;border-bottom:1px solid #E1E7E9;padding:52px 20px 16px;display:flex;align-items:center;gap:10px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1B2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    <div style="font-family:Sora,sans-serif;font-weight:800;font-size:22px;">Kontakt</div>
  </div>

  <div style="padding:16px 20px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden;">
    <!-- organizer card -->
    <div style="background:#0C5A63;border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;">
      <div style="width:48px;height:48px;border-radius:13px;background:#0A464D;display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:800;font-size:18px;color:#fff;flex:none;">PTN</div>
      <div style="color:#fff;">
        <div style="font-size:11px;color:#BfE0E2;font-weight:600;">ORGANIZATOR</div>
        <div style="font-family:Sora,sans-serif;font-weight:700;font-size:16px;margin-top:2px;">Pol. Tow. Nefrologiczne</div>
        <div style="font-size:12px;color:#BfE0E2;margin-top:2px;">Biuro kongresu FND 2027</div>
      </div>
    </div>

    <!-- contact rows -->
    <div class="crow">
      <div class="cico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C5A63" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c0 8 7 15 15 15l0-3.5-4-1.5-2 2a12 12 0 0 1-6-6l2-2-1.5-4L4 5z"/></svg></div>
      <div style="flex:1;"><div style="font-size:12px;color:#9AA7AD;">Telefon (pon-pt 9-17)</div><div style="font-weight:600;font-size:15px;">+48 22 123 45 67</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7D0D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="crow">
      <div class="cico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C5A63" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg></div>
      <div style="flex:1;"><div style="font-size:12px;color:#9AA7AD;">E-mail</div><div style="font-weight:600;font-size:15px;">biuro@fnd2027.pl</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7D0D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="crow">
      <div class="cico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C5A63" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div>
      <div style="flex:1;"><div style="font-size:12px;color:#9AA7AD;">Strona</div><div style="font-weight:600;font-size:15px;">fnd2027.pl</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7D0D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="crow">
      <div class="cico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C5A63" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      <div style="flex:1;"><div style="font-size:12px;color:#9AA7AD;">Adres · Hala Expo</div><div style="font-weight:600;font-size:14px;line-height:1.35;">ul. Kongresowa 12, Warszawa</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7D0D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <!-- emergency -->
    <div style="display:flex;gap:12px;align-items:center;background:#FDE6E1;border:1px solid #FFD2C9;border-radius:14px;padding:13px 14px;margin-top:2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9503B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg>
      <div style="flex:1;"><div style="font-weight:600;font-size:14px;">Pomoc na miejscu</div><div style="font-size:12px;color:#8a4a3d;">Punkt info przy wejściu · tel. wewn. 100</div></div>
    </div>
  </div>

  <!-- bottom nav -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E1E7E9;display:flex;padding:10px 8px 16px;">
    <div class="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA7AD" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg>Wydarzenie</div>
    <div class="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA7AD" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Agenda</div>
    <div class="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA7AD" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Aktualności</div>
    <div class="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA7AD" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Mapa</div>
    <div class="nav" style="color:#0C5A63;font-weight:600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0C5A63" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Więcej</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
