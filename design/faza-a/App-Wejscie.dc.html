<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  body{margin:0;}
  a{color:#0C5A63;} a:hover{color:#08363B;}
  .seal{display:flex;align-items:center;justify-content:center;border-radius:999px;background:#0C5A63;flex:none;}
</style>
</helmet>
<div style="box-sizing:border-box;width:390px;height:844px;background:#F6F8F9;color:#0A1B2A;font-family:Inter,system-ui,sans-serif;padding:64px 28px 32px;display:flex;flex-direction:column;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
    <div class="seal" style="width:84px;height:84px;box-shadow:0 12px 30px rgba(12,90,99,.28);">
      <svg width="50" viewBox="0 0 40 48" fill="none"><rect x="9" y="7" width="6" height="34" rx="3" fill="#fff"/><path d="M31 9 L18 9 L18 39 L31 39" stroke="#FF6B57" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 24 L28 24" stroke="#FF6B57" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="31" cy="9" r="3.2" fill="#FF6B57"/></svg>
    </div>
    <h1 style="font-family:Sora,sans-serif;font-weight:800;font-size:30px;letter-spacing:-.8px;margin:26px 0 8px;">Witaj w Eskulapp</h1>
    <p style="font-size:15px;color:#5B6B72;line-height:1.5;margin:0 0 34px;max-width:280px;">Wpisz kod wydarzenia, aby pobrać jego program na telefon.</p>

    <div style="width:100%;text-align:left;">
      <label style="font-size:13px;font-weight:600;color:#0A1B2A;display:block;margin-bottom:8px;">Kod wydarzenia</label>
      <div style="display:flex;align-items:center;gap:10px;border:1.5px solid #0C5A63;border-radius:14px;background:#fff;padding:14px 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C5A63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a5 5 0 1 0-4.9 6H14v3h3v3h4v-4l-4.1-4"/></svg>
        <span style="font-size:22px;font-weight:600;letter-spacing:.22em;color:#0A1B2A;">FND2027</span>
      </div>
    </div>

    <button style="width:100%;margin-top:18px;font-family:Inter,sans-serif;font-weight:600;font-size:16px;color:#fff;background:#0C5A63;border:none;border-radius:14px;padding:16px;">Pobierz wydarzenie</button>

    <div style="display:flex;align-items:flex-start;gap:10px;margin-top:24px;background:#D7EAEC;border-radius:12px;padding:14px 16px;text-align:left;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C5A63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px;"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>
      <span style="font-size:13px;color:#0C5A63;line-height:1.5;"><b>Bez logowania.</b> Nie zakładasz konta, dane zapiszą się lokalnie i zadziałają offline na sali.</span>
    </div>
  </div>

  <div style="text-align:center;font-size:14px;color:#5B6B72;">Nie masz kodu? <a style="font-weight:600;text-decoration:none;">Skąd go wziąć</a></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
