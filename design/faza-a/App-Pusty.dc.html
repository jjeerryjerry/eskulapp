<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  body{margin:0;}
  a{color:#0C5A63;} a:hover{color:#08363B;}
  .seal{display:flex;align-items:center;justify-content:center;border-radius:999px;background:#0C5A63;flex:none;}
</style>
</helmet>
<div style="box-sizing:border-box;width:390px;height:844px;background:#F6F8F9;color:#0A1B2A;font-family:Inter,system-ui,sans-serif;padding:52px 20px 24px;display:flex;flex-direction:column;">
  <!-- top bar -->
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">
    <div class="seal" style="width:36px;height:36px;"><svg width="22" viewBox="0 0 40 48" fill="none"><rect x="9" y="7" width="6" height="34" rx="3" fill="#fff"/><path d="M31 9 L18 9 L18 39 L31 39" stroke="#FF6B57" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 24 L28 24" stroke="#FF6B57" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="31" cy="9" r="3.2" fill="#FF6B57"/></svg></div>
    <div style="font-family:Sora,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.5px;">Moje wydarzenia</div>
  </div>

  <!-- empty state -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px;">
    <div style="width:120px;height:120px;border-radius:999px;background:#D7EAEC;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#0C5A63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M12 13v5M9.5 15.5h5" stroke="#FF6B57" stroke-width="1.8"/></svg>
    </div>
    <div style="font-family:Sora,sans-serif;font-weight:700;font-size:20px;">Nie masz jeszcze wydarzeń</div>
    <div style="font-size:14px;color:#5B6B72;line-height:1.5;margin-top:10px;max-width:280px;">Masz kod od organizatora? Wpisz go, a pobierzemy całą agendę na telefon, działa też offline.</div>

    <!-- code hint -->
    <div style="display:flex;gap:9px;margin-top:22px;">
      <span style="width:38px;height:46px;border:1.5px solid #B7D6D9;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:20px;color:#0C5A63;">F</span>
      <span style="width:38px;height:46px;border:1.5px solid #B7D6D9;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:20px;color:#0C5A63;">N</span>
      <span style="width:38px;height:46px;border:1.5px solid #B7D6D9;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:20px;color:#0C5A63;">D</span>
      <span style="width:38px;height:46px;border:1.5px solid #E1E7E9;border-radius:10px;background:#F6F8F9;display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:20px;color:#C7D0D4;">•</span>
      <span style="width:38px;height:46px;border:1.5px solid #E1E7E9;border-radius:10px;background:#F6F8F9;display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:20px;color:#C7D0D4;">•</span>
    </div>
    <div style="font-size:12px;color:#9AA7AD;margin-top:12px;">Przykładowy kod: FND2027</div>
  </div>

  <!-- add by code -->
  <button style="width:100%;font-family:Inter,sans-serif;font-weight:600;font-size:16px;color:#fff;background:#0C5A63;border:none;border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    Dodaj wydarzenie kodem
  </button>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
