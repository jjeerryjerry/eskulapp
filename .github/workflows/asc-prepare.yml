name: ASC prepare (App Store)

# Wypelnia wersje w App Store Connect (teksty, build, zrzuty, kategorie, ocena wiekowa,
# dostepnosc, dane dla recenzenta). Do recenzji wysyla tylko z submit=true. apply=false = tylko podglad.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Zapisz zmiany (false = podglad)"
        type: boolean
        default: false
      submit:
        description: "Po zapisie wyslij wersje do recenzji Apple"
        type: boolean
        default: false
      territories:
        description: "Kraje: POL albo ALL"
        type: string
        default: "POL"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install "pyjwt[crypto]"
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_TERRITORIES: ${{ inputs.territories }}
        run: python3 tools/asc/prepare.py ${{ inputs.apply && '--apply' || '' }} ${{ inputs.submit && '--submit' || '' }}
